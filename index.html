<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ed"><title>Hostelverse — Life, Shared</title><style>
:root{--bg:#f8f5ed;--paper:#fffdf9;--ink:#3f382e;--muted:#80776c;--line:#e9e0d2;--olive:#63734f;--rust:#b97856;--cream:#eee7d8;--shadow:0 10px 32px #473b2b0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit}header{position:sticky;top:0;z-index:10;background:#fffdf9ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top{max-width:1240px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px}.logo{font:700 27px Georgia,serif;letter-spacing:-1.5px}.logo span{color:var(--rust)}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700}.right{display:flex;align-items:center;gap:9px}.avatar,.bell{width:38px;height:38px;border-radius:50%;border:0;background:#e5e8d8;color:#43553b;font-weight:800}.bell{background:#f1eadf}.nav{max-width:1240px;margin:auto;display:flex;gap:5px;overflow-x:auto;padding:0 24px 11px;scrollbar-width:thin}.nav button{border:0;border-radius:10px;background:transparent;color:#74695e;white-space:nowrap;padding:10px 13px;font-size:12px}.nav button.active{background:#e7e9da;color:#40543a;font-weight:750}main{max-width:1240px;min-height:75vh;margin:auto;padding:25px 24px 55px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(110deg,#ebe9d9,#e9e3d3);border:1px solid #e3dfcd;border-radius:21px;padding:40px}.hero h1{font:normal clamp(30px,4vw,52px)/1.1 Georgia,serif;letter-spacing:-2px;margin:13px 0}.hero em{color:var(--olive)}.hero p{line-height:1.7;color:#746d61;font-size:14px}.hero-art{font-size:clamp(58px,10vw,120px)}.btn{border:0;background:var(--olive);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:700}.btn:hover{filter:brightness(.94)}.btn.light{background:#eee8dd;color:var(--ink)}.btn.rust{background:var(--rust)}.btn.sm{padding:8px 11px;font-size:11px}.btn.outline{border:1px solid var(--line);background:white;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.panel,.stat,.action{border:1px solid var(--line);background:var(--paper);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel.pad,.stat,.action{padding:18px}.stat strong{font:normal 29px Georgia,serif}.muted{color:var(--muted)}.small{font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:28px 0 15px}.section-title h2{font-size:25px;letter-spacing:-.8px;margin:0 0 5px}.section-title p{margin:0;color:var(--muted);font-size:13px}.action{text-align:left;min-height:128px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}.action .emoji{font-size:30px}.action strong{font-size:14px}.action .muted{font-size:12px}.photo{height:150px;background:#f0e9de;display:grid;place-items:center;font-size:63px}.itembody{padding:15px}.itembody h3{font-size:15px;margin:12px 0 7px}.chip{display:inline-block;padding:5px 9px;background:#f1eadf;color:#756452;border-radius:20px;font-size:11px}.price{font-weight:800;font-size:18px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{display:flex;align-items:center;gap:12px}.field{border:1px solid #ded4c6;background:#fff;border-radius:10px;padding:11px 12px;width:100%;min-width:0;color:var(--ink)}.field:focus{outline:2px solid #bac6a7;outline-offset:1px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar .field:first-child{flex:1;min-width:180px}.toolbar select{width:auto}.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px}.line{border-bottom:1px solid var(--line);padding:13px 0}.line:last-child{border-bottom:0}.foodemoji{font-size:35px;background:#f4ede3;border-radius:12px;padding:12px}.form{display:grid;gap:12px;max-width:600px}.form label{font-size:12px;font-weight:700;display:grid;gap:6px}.tag{color:var(--olive);font-size:11px;font-weight:800;letter-spacing:.6px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.tabs button{border:0;border-radius:9px;background:#eee7db;padding:10px 14px;font-size:12px}.tabs button.on{background:var(--olive);color:white}.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;right:20px;z-index:50;max-width:360px;padding:15px 18px;border-radius:12px;background:#43563b;color:white;box-shadow:0 12px 30px #0002;font-size:13px}.modal-back{position:fixed;inset:0;z-index:30;background:#27231d8c;display:grid;place-items:center;padding:15px}.modal{background:var(--paper);width:min(540px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:19px}.modal h2{margin-top:0}.footer{border-top:1px solid var(--line);background:var(--paper);padding:25px;text-align:center;font-size:12px;color:var(--muted)}.badge{background:#b97856;color:white;font-size:10px;padding:3px 6px;border-radius:12px}.note{background:#eee9dd;border-radius:12px;padding:13px;font-size:12px;line-height:1.7;color:#706458}.counter{display:flex;align-items:center;gap:8px}.counter button{border:1px solid var(--line);background:white;border-radius:7px;padding:5px 10px}.hidden{display:none!important}@media(max-width:850px){.grid.four{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.hero{padding:25px}}@media(max-width:560px){.top{padding:12px 15px}.nav{padding:0 10px 10px}main{padding:15px 12px 40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero{padding:22px}.hero-art{font-size:45px}.photo{height:110px;font-size:44px}.itembody{padding:11px}.itembody h3{font-size:13px}.price{font-size:15px}.section-title h2{font-size:21px}.logo{font-size:22px}}@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="top"><div><div class="logo">✳ hostelverse<span>.</span></div><div class="eyebrow">LIFE, SHARED.</div></div><div class="right"><button class="bell" id="bell" aria-label="Notifications">🔔<span id="bellcount"></span></button><button class="avatar" id="profile" aria-label="Profile">AS</button></div></div><nav class="nav" id="nav"></nav></header><main id="app"></main><footer class="footer">✳ hostelverse. &nbsp;·&nbsp; Made for hostel life &nbsp;·&nbsp; Standalone browser prototype &nbsp;·&nbsp; No AI</footer><div id="overlay"></div><div id="toastarea"></div><script>
'use strict';
(()=>{
const KEY='hostelverse_singlefile_v2';
const defaults={profile:{name:'Aarav Student',hostel:'Block A',room:'A-204'},listings:[{id:'l1',name:'Casio Scientific Calculator',cat:'Electronics',price:450,type:'Sale',emoji:'🧮',hostel:'Block A',condition:'Good'},{id:'l2',name:'Badminton Racket',cat:'Sports',price:20,type:'Rent',emoji:'🏸',hostel:'Block B',condition:'Excellent'},{id:'l3',name:'Desk Study Lamp',cat:'Essentials',price:180,type:'Sale',emoji:'💡',hostel:'Block A',condition:'Like new'},{id:'l4',name:'Gaming Controller',cat:'Gaming',price:35,type:'Rent',emoji:'🎮',hostel:'Block C',condition:'Excellent'},{id:'l5',name:'Engineering Mathematics Book',cat:'Books',price:0,type:'Free',emoji:'📚',hostel:'Block B',condition:'Good'},{id:'l6',name:'Bluetooth Speaker',cat:'Electronics',price:25,type:'Rent',emoji:'🔊',hostel:'Block A',condition:'Good'}],orders:[],cart:{},bookings:[],favorites:[],notifications:[],messages:[{id:'m1',name:'Rohan · Block B',text:'Hi! Is the racket available tomorrow?'}],trips:[{id:'t1',name:'Railway Station',time:'Friday · 5:30 PM',seats:2,price:90},{id:'t2',name:'Airport Terminal',time:'Saturday · 7:00 AM',seats:3,price:180},{id:'t3',name:'City Bus Stand',time:'Sunday · 4:00 PM',seats:1,price:60}],posts:[{id:'p1',cat:'Lost & Found',icon:'🔎',title:'Found: Blue water bottle',desc:'Near the library entrance. Contact to verify ownership.'},{id:'p2',cat:'Skill Exchange',icon:'💻',title:'Offering C++ tutoring',desc:'Can help with basics and debugging.'},{id:'p3',cat:'Group Buying',icon:'📦',title:'Bulk stationery order',desc:'Need 3 more students to join.'},{id:'p4',cat:'Events',icon:'🎉',title:'Hackathon team finder',desc:'Looking for a UI designer and frontend developer.'},{id:'p5',cat:'Donations',icon:'🌱',title:'Free notebooks',desc:'Unused pages available for anyone who needs them.'}],requests:[{id:'r1',title:'Need a lab coat for Monday',by:'Student · Block B'},{id:'r2',title:'Looking for a calculator tomorrow',by:'Student · Block A'}]};
function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object')return {...structuredClone(defaults),...saved}}catch(e){}return structuredClone(defaults)}
let db=load(),page='Home',filter='All',query='',canteenView='student',postFilter='All';
const food=[{id:'f1',name:'Masala Dosa',price:55,emoji:'🥞',desc:'Crispy dosa with chutney'},{id:'f2',name:'Veg Thali',price:85,emoji:'🍛',desc:'Rice, roti, dal and sabzi'},{id:'f3',name:'Paneer Sandwich',price:60,emoji:'🥪',desc:'Toasted with fresh paneer'},{id:'f4',name:'Cold Coffee',price:45,emoji:'🥤',desc:'Chilled and creamy'},{id:'f5',name:'Maggi',price:35,emoji:'🍜',desc:'Classic hostel favorite'},{id:'f6',name:'Samosa',price:15,emoji:'🥟',desc:'Freshly prepared snack'}];
const tabs=['Home','Marketplace','Rentals','Canteen','Cab Pool','Community','Requests','Messages','My Activity'];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>String(Date.now())+Math.random().toString(36).slice(2,7);
const rupees=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Browser storage unavailable; changes may not persist.')}updateBell()}
function toast(t){$('#toastarea').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>{const el=$('#toastarea');if(el)el.innerHTML=''},3500)}
function notify(t){db.notifications.unshift({id:id(),text:t,at:new Date().toLocaleString(),read:false});save();toast(t)}
function updateBell(){const n=db.notifications.filter(x=>!x.read).length;$('#bellcount').innerHTML=n?'<span class="badge">'+n+'</span>':''}
function go(p){page=p;query='';filter='All';render();window.scrollTo({top:0,behavior:'smooth'})}
function title(t,d,button=''){return '<div class="section-title"><div><h2>'+t+'</h2><p>'+d+'</p></div>'+button+'</div>'}
function card(x){return '<article class="panel"><div class="photo">'+x.emoji+'</div><div class="itembody"><div class="between"><span class="chip">'+esc(x.type)+'</span><button class="btn light sm" data-fav="'+esc(x.id)+'" aria-label="Favorite">'+(db.favorites.includes(x.id)?'♥':'♡')+'</button></div><h3>'+esc(x.name)+'</h3><div class="muted small">'+esc(x.hostel)+' · '+esc(x.condition)+'</div><div class="between" style="margin-top:14px"><span class="price">'+(x.price?rupees(x.price)+(x.type==='Rent'?'/hr':''):'Free')+'</span><button class="btn sm" data-request="'+esc(x.id)+'">'+(x.type==='Rent'?'Book':'Request')+'</button></div></div></article>'}
function home(){return '<div class="hero"><div><div class="tag">✦ YOUR CAMPUS, CONNECTED</div><h1>Everything you need,<br><em>just a door away.</em></h1><p>Buy less. Share more. Find your people.<br>Your entire hostel life, in one cozy corner.</p><button class="btn" data-go="Marketplace">Explore marketplace →</button></div><div class="hero-art">🪴📚</div></div><div class="grid" style="margin-top:16px"><div class="stat"><strong>'+db.listings.length+'</strong><div class="muted small">Available listings</div></div><div class="stat"><strong>'+db.bookings.length+'</strong><div class="muted small">Your item requests</div></div><div class="stat"><strong>'+db.orders.length+'</strong><div class="muted small">Your food orders</div></div></div>'+title('What would you like to do?','A little help goes a long way.')+'<div class="grid">'+[['🛍️','Buy & Sell','Marketplace'],['🎮','Rent Anything','Rentals'],['🍲','Order Food','Canteen'],['🚕','Travel Together','Cab Pool'],['🌿','Community','Community'],['📌','Post a Request','Requests']].map(a=>'<button class="action" data-go="'+a[2]+'"><span class="emoji">'+a[0]+'</span><strong>'+a[1]+'</strong><span class="muted">Explore →</span></button>').join('')+'</div>'+title('Fresh finds','Shared by your hostel neighbors.','<button class="btn light" data-go="Marketplace">View all →</button>')+'<div class="grid">'+db.listings.slice(0,3).map(card).join('')+'</div>'}
function marketplace(rent=false){let a=db.listings.filter(x=>(!rent||x.type==='Rent')&&(filter==='All'||x.cat===filter)&&x.name.toLowerCase().includes(query.toLowerCase()));return title(rent?'Rent & Borrow':'The Marketplace',rent?'Borrow what you need, only when you need it.':'Pre-loved treasures from your hostel neighbors.','<button class="btn" data-go="New Listing">+ List an item</button>')+'<div class="toolbar"><input class="field" id="search" placeholder="Search items..." value="'+esc(query)+'"><select class="field" id="filter">'+['All','Electronics','Sports','Essentials','Gaming','Books','Other'].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="grid">'+(a.length?a.map(card).join(''):'<div class="empty">No matching items found.</div>')+'</div>'}
function listingForm(){return title('List something','Give your unused items a new home.')+'<form id="listingform" class="panel pad form"><label>Item name<input class="field" name="name" required maxlength="80"></label><label>Category<select class="field" name="cat">'+['Electronics','Sports','Essentials','Gaming','Books','Other'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Listing type<select class="field" name="type"><option>Sale</option><option>Rent</option><option>Free</option></select></label><label>Price (₹, per hour for rentals)<input class="field" type="number" min="0" max="1000000" name="price" value="0" required></label><label>Hostel / block<input class="field" name="hostel" value="'+esc(db.profile.hostel)+'" required maxlength="50"></label><label>Condition<select class="field" name="condition"><option>Good</option><option>Excellent</option><option>Like new</option><option>Used</option></select></label><button class="btn">Publish listing</button></form>'}
function orderList(staff=false){if(!db.orders.length)return '<div class="empty">No orders yet. Place an order to see it here.</div>';return db.orders.map(o=>'<div class="line between"><div><strong class="small">#'+esc(o.id.slice(-6))+' · '+rupees(o.total)+'</strong><div class="muted small">'+esc(o.hostel)+' · Room '+esc(o.room)+'</div><div class="muted small">'+o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')+'</div><span class="chip">'+esc(o.status)+'</span></div>'+(staff&&o.status!=='Collected'?'<button class="btn sm" data-progress="'+esc(o.id)+'">'+(o.status==='Placed'?'Start preparing':o.status==='Preparing'?'Mark ready':'Mark collected')+'</button>':'')+'</div>').join('')}
function canteen(){const total=food.reduce((n,f)=>n+(db.cart[f.id]||0)*f.price,0);return title('Canteen Express','Good food, zero queue. Order from your room.','<span class="chip">🍲 Demo kitchen</span>')+'<div class="tabs"><button data-canteen="student" class="'+(canteenView==='student'?'on':'')+'">🍽️ Student view</button><button data-canteen="staff" class="'+(canteenView==='staff'?'on':'')+'">👨‍🍳 Canteen staff</button></div>'+(canteenView==='staff'?'<div class="note" style="margin-bottom:15px">Demo staff controls are available without login. In a real deployment, staff access must be authenticated and restricted.</div><div class="panel pad"><h3>Kitchen order board</h3>'+orderList(true)+'</div>':'<div class="split"><div class="panel pad"><h3>Today’s menu</h3>'+food.map(f=>'<div class="line row"><div class="foodemoji">'+f.emoji+'</div><div style="flex:1"><strong>'+esc(f.name)+'</strong><div class="muted small">'+esc(f.desc)+'</div><strong class="small">'+rupees(f.price)+'</strong></div><button class="btn sm" data-add="'+f.id+'">+ Add</button></div>').join('')+'</div><div><div class="panel pad"><h3>🧺 Your order</h3>'+(total?food.filter(f=>db.cart[f.id]).map(f=>'<div class="line between"><div><strong class="small">'+f.name+'</strong><div class="muted small">'+rupees(f.price)+'</div></div><div class="counter"><button data-dec="'+f.id+'">−</button><strong>'+db.cart[f.id]+'</strong><button data-add="'+f.id+'">+</button></div></div>').join(''):'<p class="muted small">Your cart is empty. Add something delicious!</p>')+'<div class="line between"><strong>Total</strong><strong>'+rupees(total)+'</strong></div><form id="checkout" class="form" style="margin-top:13px"><label>Hostel / block<input class="field" name="hostel" value="'+esc(db.profile.hostel)+'" required maxlength="50"></label><label>Room number (private demo detail)<input class="field" name="room" value="'+esc(db.profile.room)+'" required maxlength="30"></label><button class="btn" '+(!total?'disabled':'')+'>Place order · '+rupees(total)+'</button><p class="muted small">Demo only · Pay at counter · Pickup when ready</p></form></div><div class="panel pad" style="margin-top:15px"><h3>📋 My orders</h3>'+orderList(false)+'</div></div></div>')}
function trips(){return title('Travel Together','Coordinate licensed cab rides and split costs.','<button class="btn" data-modal="trip">+ Create a trip</button>')+'<div class="grid">'+db.trips.map(t=>'<article class="panel pad"><div style="font-size:30px">🚕</div><h3>'+esc(t.name)+'</h3><div class="muted small">'+esc(t.time)+'</div><p class="small">'+esc(t.seats)+' seats available</p><strong>'+rupees(t.price)+' / person (estimate)</strong><button class="btn" style="display:block;margin-top:15px;width:100%" data-trip="'+esc(t.id)+'">Request to join</button></article>').join('')+'</div>'}
function community(){let cats=['All','Lost & Found','Skill Exchange','Group Buying','Events','Donations','Community'];let ps=db.posts.filter(x=>postFilter==='All'||x.cat===postFilter);return title('The Community','Find help, share skills, and make hostel life better.','<button class="btn" data-modal="post">+ Create post</button>')+'<div class="toolbar"><select class="field" id="postfilter">'+cats.map(x=>'<option '+(postFilter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="grid">'+(ps.length?ps.map(p=>'<article class="panel pad"><div style="font-size:30px">'+p.icon+'</div><span class="chip" style="margin:12px 0">'+esc(p.cat)+'</span><h3>'+esc(p.title)+'</h3><p class="muted small" style="line-height:1.6">'+esc(p.desc)+'</p><button class="btn light sm" data-connect="'+esc(p.id)+'">Connect →</button></article>').join(''):'<div class="empty">No posts in this category.</div>')+'</div>'}
function requests(){return title('Request Board','Ask your neighbors. Someone might have what you need.','<button class="btn" data-modal="request">+ Post request</button>')+'<div class="panel pad">'+db.requests.map(r=>'<div class="line between"><div><strong>'+esc(r.title)+'</strong><div class="muted small">'+esc(r.by)+'</div></div><button class="btn light sm" data-help="'+esc(r.id)+'">I can help</button></div>').join('')+'</div>'}
function messages(){return title('Messages','Demo conversation log stored in this browser.')+'<div class="panel pad" style="max-width:700px"><h3>Community inbox</h3>'+db.messages.map(m=>'<div class="line row"><div class="foodemoji" style="font-size:20px">💬</div><div><strong class="small">'+esc(m.name)+'</strong><div class="muted small">'+esc(m.text)+'</div></div></div>').join('')+'<form id="messageform" class="row" style="margin-top:16px"><input class="field" name="text" placeholder="Write a message..." maxlength="500" required><button class="btn">Send</button></form></div>'}
function activity(){return title('My Activity','Your hostel life, all in one place.')+'<div class="grid"><div class="stat"><strong>'+db.favorites.length+'</strong><div class="muted small">Saved items</div></div><div class="stat"><strong>'+db.bookings.length+'</strong><div class="muted small">Item requests</div></div><div class="stat"><strong>'+db.orders.length+'</strong><div class="muted small">Food orders</div></div></div><div class="panel pad" style="margin-top:17px"><h3>Item requests</h3>'+(db.bookings.length?db.bookings.map(b=>'<div class="line between"><div><strong>'+esc(b.name)+'</strong><div class="muted small">'+esc(b.type)+'</div></div><span class="chip">'+esc(b.status)+'</span></div>').join(''):'<div class="empty">No item requests yet.</div>')+'</div><div class="panel pad" style="margin-top:17px"><h3>Food orders</h3>'+orderList()+'</div><div class="panel pad" style="margin-top:17px"><h3>Saved items</h3><div class="grid">'+(db.listings.filter(x=>db.favorites.includes(x.id)).map(card).join('')||'<div class="empty">Nothing saved yet.</div>')+'</div></div>'}
function profile(){return title('Your Profile','Edit the details used for demo food orders and community posts.')+'<form id="profileform" class="panel pad form"><label>Your name<input class="field" name="name" value="'+esc(db.profile.name)+'" maxlength="60" required></label><label>Hostel / block<input class="field" name="hostel" value="'+esc(db.profile.hostel)+'" maxlength="50" required></label><label>Room number<input class="field" name="room" value="'+esc(db.profile.room)+'" maxlength="30" required></label><button class="btn">Save profile</button></form><div class="note" style="margin-top:20px">This is a browser-only demo. Do not enter sensitive personal details on shared devices. Your room number is stored locally, not sent to a server.</div><button class="btn light" style="margin-top:15px" id="reset">Reset all demo data</button>'}
function render(){const el=$('#app');el.innerHTML=page==='Home'?home():page==='Marketplace'?marketplace():page==='Rentals'?marketplace(true):page==='Canteen'?canteen():page==='Cab Pool'?trips():page==='Community'?community():page==='Requests'?requests():page==='Messages'?messages():page==='My Activity'?activity():page==='New Listing'?listingForm():page==='Profile'?profile():home();$('#nav').innerHTML=tabs.map(t=>'<button data-go="'+t+'" class="'+(page===t?'active':'')+'">'+t+'</button>').join('');updateBell()}
function modal(kind){let forms={trip:['Create a cab-pool trip','<label>Destination<input class="field" name="name" required maxlength="80"></label><label>Departure date and time<input class="field" type="datetime-local" name="time" required></label><label>Available seats<input class="field" type="number" name="seats" min="1" max="8" value="2" required></label><label>Estimated cost per person (₹)<input class="field" type="number" name="price" min="0" max="100000" value="100" required></label>'],post:['Create a community post','<label>Category<select class="field" name="cat">'+['Lost & Found','Skill Exchange','Group Buying','Events','Donations','Community'].map(c=>'<option>'+c+'</option>').join('')+'</select></label><label>Title<input class="field" name="title" required maxlength="100"></label><label>Description<textarea class="field" name="desc" rows="4" maxlength="1000" required></textarea></label>'],request:['Post a request','<label>What do you need?<textarea class="field" name="title" rows="3" maxlength="200" required></textarea></label>']};let f=forms[kind];$('#overlay').innerHTML='<div class="modal-back" id="modalback"><div class="modal" role="dialog" aria-modal="true" aria-label="'+f[0]+'"><div class="between"><h2>'+f[0]+'</h2><button class="btn light sm" data-close>✕</button></div><form id="modalform" class="form">'+f[1]+'<button class="btn">Save</button></form></div></div>';$('#modalform').dataset.kind=kind}
function closeModal(){$('#overlay').innerHTML=''}
function submitModal(form){const d=Object.fromEntries(new FormData(form)),kind=form.dataset.kind;if(kind==='trip'){db.trips.unshift({id:id(),name:d.name,time:new Date(d.time).toLocaleString(),seats:Number(d.seats),price:Number(d.price)});notify('Cab-pool trip created.')}if(kind==='post'){db.posts.unshift({id:id(),cat:d.cat,title:d.title,desc:d.desc,icon:({'Lost & Found':'🔎','Skill Exchange':'💻','Group Buying':'📦','Events':'🎉','Donations':'🌱','Community':'🌿'})[d.cat]});notify('Community post published.')}if(kind==='request'){db.requests.unshift({id:id(),title:d.title,by:db.profile.name+' · '+db.profile.hostel});notify('Request posted.')}save();closeModal();render()}
function handleClick(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.fav){let x=b.dataset.fav;db.favorites=db.favorites.includes(x)?db.favorites.filter(y=>y!==x):[...db.favorites,x];save();render();return}if(b.dataset.request){const x=db.listings.find(z=>z.id===b.dataset.request);if(!x)return;db.bookings.unshift({id:id(),name:x.name,type:x.type,status:'Requested'});notify('Request sent for '+x.name+' (demo).');render();return}if(b.dataset.canteen){canteenView=b.dataset.canteen;render();return}if(b.dataset.add){db.cart[b.dataset.add]=(db.cart[b.dataset.add]||0)+1;save();render();return}if(b.dataset.dec){db.cart[b.dataset.dec]=Math.max(0,(db.cart[b.dataset.dec]||0)-1);save();render();return}if(b.dataset.progress){const o=db.orders.find(z=>z.id===b.dataset.progress);if(!o)return;o.status=o.status==='Placed'?'Preparing':o.status==='Preparing'?'Ready for pickup':'Collected';notify(o.status==='Ready for pickup'?'🔔 Order #'+o.id.slice(-6)+' is ready for pickup! Room '+o.room+', '+o.hostel:'Order #'+o.id.slice(-6)+' is '+o.status);render();return}if(b.dataset.modal){modal(b.dataset.modal);return}if(b.hasAttribute('data-close')){closeModal();return}if(b.dataset.trip){notify('Join request recorded in this browser (demo).');return}if(b.dataset.connect){const p=db.posts.find(z=>z.id===b.dataset.connect);db.messages.unshift({id:id(),name:p.title,text:'Connection request started (demo).'});notify('Connection request added to your messages.');return}if(b.dataset.help){notify('Offer to help recorded in this browser (demo).');return}if(b.id==='reset'){if(confirm('Reset all Hostelverse demo data in this browser?')){db=structuredClone(defaults);save();go('Home');toast('Demo data reset.')}return}}
function handleSubmit(e){const f=e.target;if(!['listingform','checkout','messageform','profileform','modalform'].includes(f.id))return;e.preventDefault();const d=Object.fromEntries(new FormData(f));if(f.id==='modalform'){submitModal(f);return}if(f.id==='listingform'){db.listings.unshift({id:id(),name:d.name,cat:d.cat,type:d.type,price:d.type==='Free'?0:Number(d.price),hostel:d.hostel,condition:d.condition,emoji:({Electronics:'🔌',Sports:'🏸',Essentials:'🪴',Gaming:'🎮',Books:'📚',Other:'📦'})[d.cat]});notify('Your listing is live!');go('Marketplace');return}if(f.id==='checkout'){const items=food.filter(x=>db.cart[x.id]>0).map(x=>({...x,qty:db.cart[x.id]}));if(!items.length)return;const total=items.reduce((s,x)=>s+x.price*x.qty,0);const oid=id();db.orders.unshift({id:oid,hostel:d.hostel,room:d.room,items,total,status:'Placed'});db.profile.hostel=d.hostel;db.profile.room=d.room;db.cart={};notify('Order #'+oid.slice(-6)+' placed! Switch to staff view to prepare it.');render();return}if(f.id==='messageform'){db.messages.push({id:id(),name:'You',text:d.text});save();render();toast('Message saved in this browser.');return}if(f.id==='profileform'){db.profile=d;save();toast('Profile saved.');render();return}}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;const area=$('#app');area.innerHTML=marketplace(page==='Rentals');const input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='postfilter'){postFilter=e.target.value;render()}});$('#profile').onclick=()=>go('Profile');$('#bell').onclick=()=>{db.notifications.forEach(n=>n.read=true);save();$('#overlay').innerHTML='<div class="modal-back"><div class="modal"><div class="between"><h2>🔔 Notifications</h2><button class="btn light sm" data-close>✕</button></div>'+(db.notifications.length?db.notifications.slice(0,25).map(n=>'<div class="line"><strong class="small">'+esc(n.text)+'</strong><div class="muted small">'+esc(n.at)+'</div></div>').join(''):'<div class="empty">All caught up!</div>')+'</div></div>'};$('#overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-back'))closeModal()});window.addEventListener('storage',e=>{if(e.key===KEY){db=load();render()}});render();
})();
</script></body></html>
